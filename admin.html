<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Saubhagya</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#6e0c1f">
    <link rel="icon" href="images/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .review { display: grid; grid-template-columns: 200px 1fr; gap: 1.2rem; padding: 1.2rem 0; border-bottom: 1px solid var(--line); }
        .review:last-child { border-bottom: none; }
        .review .pics { display: flex; flex-direction: column; gap: 0.5rem; }
        .review .pics img { width: 100%; border-radius: 10px; cursor: zoom-in; }
        .review .pics.row2 { flex-direction: row; }
        .review .pics.row2 img { width: 50%; }
        .kv { font-size: 0.85rem; color: var(--text-mid); }
        .kv b { color: var(--text-dark); font-weight: 500; }
        @media (max-width: 640px) { .review { grid-template-columns: 1fr; } .review .pics { flex-direction: row; } .review .pics img { width: 33%; } }
    </style>
</head>
<body>
    <div id="site-nav"></div>

    <main>
        <header class="page-head">
            <div class="mandala" aria-hidden="true"><svg><use href="#mandala"/></svg></div>
            <h1>Admin <em>panel</em></h1>
            <p>Review profiles, payments, verifications and reports</p>
        </header>

        <div class="container">
            <div id="launch-box"></div>
            <div id="scan-notice"></div>
            <div class="stat-grid" id="stats"></div>
            <div class="card mt-3">
                <div class="tabs" id="tabs">
                    <button type="button" class="active" data-tab="profiles">Profiles <span class="count" id="n-profiles" hidden></span></button>
                    <button type="button" data-tab="payments">Payments <span class="count" id="n-payments" hidden></span></button>
                    <button type="button" data-tab="money">Payment report</button>
                    <button type="button" data-tab="verifications">ID checks <span class="count" id="n-verifications" hidden></span></button>
                    <button type="button" data-tab="jobChecks">Job checks <span class="count" id="n-jobChecks" hidden></span></button>
                    <button type="button" data-tab="reports">Reports <span class="count" id="n-reports" hidden></span></button>
                    <button type="button" data-tab="scan">Fake-profile scan</button>
                    <button type="button" data-tab="find">Find member</button>
                </div>
                <div id="tab-body"><div class="spinner"></div></div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <script type="module" src="assets/js/pages/admin.js"></script>
</body>
</html>
