<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Saubhagya</title>
    <meta name="theme-color" content="#6e0c1f">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="site-nav"></div>

    <main>
        <header class="page-head">
            <div class="mandala" aria-hidden="true"><svg><use href="#mandala"/></svg></div>
            <h1 id="head-title"><span data-i18n="login_welcome">Welcome</span> <em data-i18n="login_back">back</em></h1>
            <p data-i18n="login_sub">Find your life partner with a trusted, private service</p>
        </header>

        <div class="container narrow" style="max-width:480px">
            <div class="card">
                <div class="tabs" role="tablist">
                    <button type="button" class="active" data-mode="login" data-i18n="tab_login">Log in</button>
                    <button type="button" data-mode="register" data-i18n="tab_register">Register free</button>
                </div>

                <div id="msg"></div>

                <button type="button" class="btn btn-ghost btn-block" id="google-btn">
                    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
                    <span data-i18n="google">Continue with Google</span>
                </button>

                <div class="divider" data-i18n="or">or</div>

                <form id="auth-form" novalidate>
                    <div class="field" data-only="register" hidden>
                        <label for="name"><span data-i18n="your_name">Your name</span> <span class="req">*</span></label>
                        <input id="name" autocomplete="name">
                    </div>
                    <div class="field mt-1">
                        <label for="email"><span data-i18n="email">Email</span> <span class="req">*</span></label>
                        <input id="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="field mt-1">
                        <label for="password"><span data-i18n="password">Password</span> <span class="req">*</span></label>
                        <input id="password" type="password" autocomplete="current-password" required minlength="8">
                        <div class="hint" data-only="register" hidden data-i18n="pw_hint">At least 8 characters.</div>
                    </div>
                    <label class="check mt-2" data-only="register" hidden>
                        <input type="checkbox" id="agree">
                        <span><span data-i18n="agree_1">I am 18 or older and agree to the</span> <a href="terms.html" target="_blank" data-i18n="foot_terms">Terms of use</a> <span data-i18n="and">and</span> <a href="privacy.html" target="_blank" data-i18n="foot_privacy">Privacy policy</a>.</span>
                    </label>
                    <button type="submit" class="btn btn-maroon btn-block mt-2" id="submit-btn" data-i18n="tab_login">Log in</button>
                    <p class="center mt-2" data-only="login"><a href="#" id="forgot" data-i18n="forgot">Forgot password?</a></p>
                </form>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <script type="module" src="assets/js/pages/login.js"></script>
</body>
</html>
