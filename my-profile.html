<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Saubhagya</title>
    <meta name="theme-color" content="#6e0c1f">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="site-nav"></div>

    <main>
        <header class="page-head">
            <div class="mandala" aria-hidden="true"><svg><use href="#mandala"/></svg></div>
            <h1><span data-i18n="mp_title1">Your marriage</span> <em data-i18n="mp_title2">proposal</em></h1>
            <p data-i18n="mp_sub">Complete, honest profiles get many more responses</p>
        </header>

        <div class="container narrow">
            <div id="notice"></div>
            <div class="card">
                <div class="steps" id="steps"></div>
                <div class="step-title" id="step-count"></div>
                <h2 id="step-name"></h2>
                <form id="form" novalidate>
                    <div id="step-body"></div>
                    <div class="row mt-3">
                        <button type="button" class="btn btn-ghost" id="back-btn" data-i18n="back">Back</button>
                        <span class="spacer"></span>
                        <button type="submit" class="btn btn-maroon" id="next-btn" data-i18n="next">Next</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <script type="module" src="assets/js/pages/my-profile.js"></script>
</body>
</html>
